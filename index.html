<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#F7F8FA">
  <title>Typolor Studio</title>
  <meta name="description" content="Build a complete brand token set — color roles, fluid type scale, spacing, radius and buttons — preview it on a real website and export branding.md for AI design tools.">
  <meta name="keywords" content="design tokens, branding.md, color palette generator, typography scale, fluid type, clamp, tailwind v4, css variables, ai design">
  <meta name="author" content="Typolor">
  <link rel="canonical" href="https://jarifhasanakash.github.io/typolor/">

  <!-- Open Graph / social sharing -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jarifhasanakash.github.io/typolor/">
  <meta property="og:title" content="Typolor Studio — brand tokens for AI design">
  <meta property="og:description" content="Colors, roles, fluid typography, spacing and buttons in one flow. Preview on a live sample site, then export branding.md, CSS or Tailwind v4.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Typolor Studio — brand tokens for AI design">
  <meta name="twitter:description" content="Colors, roles, fluid typography, spacing and buttons in one flow. Export branding.md, CSS or Tailwind v4.">

  <link rel="icon" type="image/png" href="typolor.png">
  <link rel="apple-touch-icon" href="typolor.png">
  <script>
    (function () {
      try {
        // Light is the default; dark only when the user picked it with the toggle.
        document.documentElement.dataset.theme = localStorage.getItem('typolor-theme') === 'dark' ? 'dark' : 'light';
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Typolor Studio home">
      <img src="typolor.png" alt="" width="32" height="32">
      <span>Typolor</span>
    </a>
    <label class="project">
      <i class="ph ph-folder-simple"></i>
      <input id="projectName" data-bind="name" spellcheck="false" aria-label="Project name">
    </label>
    <nav class="stepper" id="stepper" aria-label="Steps"></nav>
    <div class="top-actions">
      <button class="icon-btn" data-act="theme" aria-label="Toggle dark mode"><i class="ph ph-moon"></i></button>
      <button class="btn primary sm" data-act="reset-all" title="Clear this project and start over"><i class="ph ph-arrow-counter-clockwise"></i><span>Reset</span></button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <footer class="app-footer">
    <span class="foot-brand"><img src="typolor.png" alt="" width="18" height="18">Typolor Studio <span class="ver" id="appVersion">v2.1.0</span></span>
    <nav aria-label="Footer">
      <a href="https://github.com/jarifhasanakash/typolor" target="_blank" rel="noopener"><i class="ph ph-github-logo"></i>GitHub</a>
      <a href="https://github.com/jarifhasanakash/typolor/blob/main/LICENSE" target="_blank" rel="noopener"><i class="ph ph-scales"></i>MIT License</a>
      <span>© 2026 Typolor Studio</span>
    </nav>
  </footer>

  <nav id="mnav" class="mnav" aria-label="Steps"></nav>
  <div id="popover" class="popover" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="typolor-engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
